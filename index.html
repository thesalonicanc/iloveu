<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #222733 0%,
            #171b27 38%,
            #0b0e15 72%,
            #040507 100%
        );

    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================
   SCENE
========================================= */

.scene {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}


/* =========================================
   GLOW BACKGROUND
========================================= */

.glow {
    position: absolute;

    width: 430px;
    height: 430px;

    border-radius: 50%;

    background: rgba(255, 60, 130, 0.07);

    filter: blur(100px);

    animation: glow 4s ease-in-out infinite;
}

@keyframes glow {

    0%, 100% {
        transform: scale(.85);
        opacity: .35;
    }

    50% {
        transform: scale(1.15);
        opacity: .8;
    }
}


/* =========================================
   HEART
========================================= */

#heart {
    position: relative;

    width: 620px;
    height: 560px;

    animation: floating 5s ease-in-out infinite;
}


@keyframes floating {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}


/* =========================================
   SEMUA TEKS TETAP HORIZONTAL
========================================= */

.love {
    position: absolute;

    transform:
        translate(-50%, -50%);

    white-space: nowrap;

    color: white;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 0;

    /*
        PENTING:
        tidak ada rotate() di sini.
        Jadi tulisan selalu horizontal.
    */

    text-shadow:
        0 0 3px #ffffff,
        0 0 6px #ffb5d0,
        0 0 11px #ff649b,
        0 0 20px #ff3d83;

    pointer-events: none;

    will-change: transform;
}


/* =========================================
   KEDIP
========================================= */

.love.blink {
    animation: blink 1.5s ease-in-out infinite alternate;
}

@keyframes blink {

    from {
        opacity: .35;
    }

    to {
        opacity: 1;
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    #heart {
        transform: scale(.72);
    }
}

@media (max-width: 450px) {

    #heart {
        transform: scale(.55);
    }
}

</style>
</head>


<body>

<div class="scene">

    <div class="glow"></div>

    <div id="heart"></div>

</div>


<script>

/* =====================================================
   PENGATURAN
===================================================== */


/*
    Jumlah tulisan di sekeliling hati.
*/

const jumlah = 110;


/*
    Kecepatan mengelilingi hati.

    Semakin besar = semakin cepat.
*/

const speed = 0.00055;


/*
    Ukuran area.
*/

const width = 620;
const height = 560;


/*
    Titik tengah.
*/

const centerX = width / 2;
const centerY = height / 2;


/*
    Ukuran hati.
*/

const scaleX = 18.2;
const scaleY = 18.2;


const heart =
    document.getElementById("heart");


/* =====================================================
   RUMUS HATI
===================================================== */

function heartPoint(t) {

    /*
        Rumus parametric heart
    */

    const x =
        16 *
        Math.pow(Math.sin(t), 3);


    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);


    return {

        x:
            centerX + x * scaleX,

        y:
            centerY - y * scaleY

    };
}


/* =====================================================
   NORMAL HATI
===================================================== */


/*
    Kita cari arah "ke dalam" hati.

    Ini dipakai untuk membuat beberapa
    lapisan tulisan, supaya hasilnya
    tidak cuma satu garis.
*/

function getNormal(t) {

    const p1 =
        heartPoint(t - 0.002);

    const p2 =
        heartPoint(t + 0.002);


    const dx =
        p2.x - p1.x;

    const dy =
        p2.y - p1.y;


    /*
        Vector normal.
    */

    let nx = -dy;
    let ny = dx;


    const length =
        Math.sqrt(nx * nx + ny * ny);


    nx /= length;
    ny /= length;


    /*
        Pastikan normal mengarah
        menuju tengah hati.
    */

    const cx =
        centerX - p1.x;

    const cy =
        centerY - p1.y;


    if (
        nx * cx +
        ny * cy < 0
    ) {

        nx *= -1;
        ny *= -1;
    }


    return {
        x: nx,
        y: ny
    };
}


/* =====================================================
   BUAT TULISAN
===================================================== */

const texts = [];


/*
    Beberapa lapisan.

    Ini yang membuat hasilnya
    terlihat seperti foto:
    bukan cuma satu garis.
*/

const layers = [

    0,
    9,
    18,
    27

];


for (let i = 0; i < jumlah; i++) {

    for (
        let layer = 0;
        layer < layers.length;
        layer++
    ) {

        const text =
            document.createElement("div");


        text.className =
            "love";


        text.innerText =
            "I love you";


        /*
            Ukuran kecil seperti foto.
        */

        text.style.fontSize =
            (8.5 + Math.random() * 2) +
            "px";


        /*
            Beberapa dibuat lebih terang.
        */

        if (
            Math.random() > .82
        ) {

            text.classList.add("blink");
        }


        /*
            Posisi awal sepanjang hati.
        */

        const angle =
            (
                Math.PI * 2 / jumlah
            ) * i;


        texts.push({

            element: text,

            angle: angle,

            /*
                Lapisan dari outline
                menuju bagian dalam.
            */

            layer:
                layers[layer],

            /*
                Sedikit variasi.
            */

            offset:
                (Math.random() - .5) * 3

        });


        heart.appendChild(text);
    }
}


/* =====================================================
   ANIMASI
===================================================== */

let start = null;


function animate(time) {

    if (!start) {
        start = time;
    }


    const elapsed =
        time - start;


    /*
        INI YANG MEMBUAT SEMUA
        BERGERAK SEARAH JARUM JAM.
    */

    const movement =
        elapsed * speed;


    texts.forEach(item => {

        /*
            Setiap tulisan bergerak
            mengikuti kurva hati.
        */

        const t =
            item.angle + movement;


        /*
            Posisi dasar outline.
        */

        const point =
            heartPoint(t);


        /*
            Arah ke dalam hati.
        */

        const normal =
            getNormal(t);


        /*
            Geser sedikit ke dalam.

            Jadi terdapat beberapa baris
            tulisan yang mengikuti outline.
        */

        const distance =
            item.layer +
            item.offset;


        const x =
            point.x +
            normal.x * distance;


        const y =
            point.y +
            normal.y * distance;


        /*
            PENTING:

            Hanya translate.

            TIDAK ADA rotate.

            Jadi semua "I love you"
            tetap HORIZONTAL.
        */

        item.element.style.transform =
            `
            translate(
                ${x}px,
                ${y}px
            )
            translate(-50%, -50%)
            `;

    });


    requestAnimationFrame(animate);
}


requestAnimationFrame(animate);

</script>

</body>
</html>
