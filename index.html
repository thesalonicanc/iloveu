<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #202633 0%,
            #141925 38%,
            #090c13 72%,
            #030405 100%
        );

    font-family: Arial, Helvetica, sans-serif;
}


/* ===============================
   SCENE
================================ */

.scene {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    perspective: 1200px;
    perspective-origin: 50% 50%;
}


/* ===============================
   BACKGROUND GLOW
================================ */

.glow {
    position: absolute;

    width: 430px;
    height: 430px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 70, 140, .12),
            rgba(255, 70, 140, 0)
        );

    filter: blur(55px);

    animation: glow 5s ease-in-out infinite;
}

@keyframes glow {

    0%,100% {
        transform: scale(.85);
        opacity: .45;
    }

    50% {
        transform: scale(1.15);
        opacity: .8;
    }
}


/* ===============================
   HEART
================================ */

#heart {

    position: relative;

    width: 620px;
    height: 560px;

    transform-style: preserve-3d;

    /*
       Gerakan sangat halus,
       bukan naik turun berlebihan.
    */

    animation: heartFloat 7s ease-in-out infinite;
}

@keyframes heartFloat {

    0%,100% {
        transform:
            translate3d(0, 0, 0)
            rotateX(0deg)
            rotateY(0deg);
    }

    50% {
        transform:
            translate3d(0, -5px, 0)
            rotateX(.7deg)
            rotateY(-1deg);
    }
}


/* ===============================
   TEXT
================================ */

.love {

    position: absolute;

    left: 0;
    top: 0;

    white-space: nowrap;

    color: #fff;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: .1px;

    transform-style: preserve-3d;

    backface-visibility: visible;

    /*
       Ini penting agar font
       tidak terasa terlalu kaku.
    */

    font-synthesis: none;

    text-shadow:
        0 0 2px rgba(255,255,255,.95),
        0 0 5px rgba(255,170,205,.9),
        0 0 10px rgba(255,75,145,.8),
        0 0 18px rgba(255,35,115,.55);

    pointer-events: none;

    will-change: transform, opacity;

    /*
       Perubahan opacity yang lembut.
    */

    transition:
        opacity .5s ease;
}


/* ===============================
   RANDOM GLOW
================================ */

.love.blink {

    animation:
        blink 2.4s ease-in-out infinite;
}

@keyframes blink {

    0%,100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }
}


/* ===============================
   MOBILE
================================ */

@media(max-width:700px) {

    #heart {
        transform: scale(.72);
    }
}

@media(max-width:450px) {

    #heart {
        transform: scale(.55);
    }
}

</style>
</head>


<body>

<div class="scene">

    <div class="glow"></div>

    <div id="heart"></div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */


/*
    Jumlah tulisan.

    85 = lebih renggang
    110 = sedang
    135 = lebih padat
*/

const jumlah =
    105;


/*
    Kecepatan.

    Jangan terlalu cepat supaya
    efek 3D bisa terlihat.
*/

const speed =
    0.00042;


/*
    Ukuran hati.
*/

const width =
    620;

const height =
    560;


/*
    Tengah.
*/

const centerX =
    width / 2;

const centerY =
    height / 2;


/*
    Skala hati.
*/

const scaleX =
    18.2;

const scaleY =
    18.2;


const heart =
    document.getElementById("heart");


/* =====================================================
   HEART CURVE
===================================================== */

function heartPoint(t) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);


    return {

        x:
            centerX +
            x * scaleX,

        y:
            centerY -
            y * scaleY
    };
}


/* =====================================================
   NORMAL
===================================================== */

function getNormal(t) {

    const p1 =
        heartPoint(t - .002);

    const p2 =
        heartPoint(t + .002);


    const dx =
        p2.x - p1.x;

    const dy =
        p2.y - p1.y;


    let nx =
        -dy;

    let ny =
        dx;


    const len =
        Math.sqrt(
            nx * nx +
            ny * ny
        );


    nx /= len;
    ny /= len;


    /*
       Pastikan normal mengarah
       ke dalam hati.
    */

    const centerDirectionX =
        centerX - p1.x;

    const centerDirectionY =
        centerY - p1.y;


    if (
        nx * centerDirectionX +
        ny * centerDirectionY < 0
    ) {

        nx *= -1;
        ny *= -1;
    }


    return {
        x: nx,
        y: ny
    };
}


/* =====================================================
   BUAT TEXT
===================================================== */

const texts = [];


/*
   4 lapisan.

   Ini membuat outline lebih
   "berisi" seperti foto.
*/

const layers = [
    0,
    8,
    16,
    24
];


for (
    let i = 0;
    i < jumlah;
    i++
) {

    for (
        let l = 0;
        l < layers.length;
        l++
    ) {

        const element =
            document.createElement("div");


        element.className =
            "love";


        element.innerText =
            "I love you";


        /*
           Ukuran sedikit berbeda.
        */

        const size =
            8.5 +
            Math.random() * 2.2;


        element.style.fontSize =
            size + "px";


        /*
           Glow random.
        */

        if (
            Math.random() > .78
        ) {

            element.classList.add(
                "blink"
            );
        }


        /*
           Posisi sepanjang hati.
        */

        const baseAngle =
            (
                Math.PI * 2 / jumlah
            ) * i;


        texts.push({

            element,

            baseAngle,

            layer:
                layers[l],

            /*
               Setiap tulisan memiliki
               kecepatan sedikit berbeda.

               Ini yang membuat gerakan
               tidak terlihat seperti robot.
            */

            velocity:
                0.92 +
                Math.random() * .16,

            /*
               Phase berbeda.
            */

            phase:
                Math.random() *
                Math.PI * 2,

            /*
               Kedalaman masing-masing
               tulisan.
            */

            depth:
                Math.random() * 20 - 10,

            /*
               Sudut 3D awal.
            */

            tilt:
                Math.random() * 8 - 4,

            /*
               Sedikit variasi posisi.
            */

            offset:
                Math.random() * 2 - 1

        });


        heart.appendChild(element);
    }
}


/* =====================================================
   ANIMATION
===================================================== */

let start =
    null;


function animate(time) {

    if (!start) {
        start = time;
    }


    const elapsed =
        time - start;


    texts.forEach(item => {

        /*
           =================================================
           GERAKAN SEARAH JARUM JAM
           =================================================

           Setiap tulisan punya velocity
           yang sedikit berbeda.
        */

        const t =
            item.baseAngle +
            elapsed *
            speed *
            item.velocity;


        /*
           Posisi outline.
        */

        const point =
            heartPoint(t);


        /*
           Normal ke dalam.
        */

        const normal =
            getNormal(t);


        /*
           =================================================
           PERGERAKAN DEPTH
           =================================================

           Tulisan tidak hanya bergerak
           pada X dan Y.

           Ia juga sedikit maju mundur
           di ruang 3D.
        */

        const wave =
            Math.sin(
                t * 2.3 +
                item.phase
            );


        const depth =
            item.depth +
            wave * 8;


        /*
           Geser sedikit masuk keluar
           dari outline.
        */

        const breathing =
            Math.sin(
                t * 1.8 +
                item.phase
            ) * 1.8;


        const distance =
            item.layer +
            item.offset +
            breathing;


        const x =
            point.x +
            normal.x *
            distance;


        const y =
            point.y +
            normal.y *
            distance;


        /*
           =================================================
           3D PARALLAX
           =================================================
        */


        /*
           Menghadap sedikit ke kanan.

           Tidak sama untuk setiap teks.
        */

        const rotateY =
            -12 +
            Math.sin(
                t * 1.4 +
                item.phase
            ) * 7;


        /*
           Sedikit maju mundur.
        */

        const rotateX =
            Math.cos(
                t * 1.7 +
                item.phase
            ) * 3;


        /*
           Scale berdasarkan depth.

           Yang terasa lebih dekat
           sedikit lebih besar.
        */

        const scale =
            1 +
            depth / 650;


        /*
           =================================================
           TRANSFORM
           =================================================

           TIDAK ADA rotateZ.

           Jadi tulisan tetap horizontal.
        */

        item.element.style.transform =
            `
            translate3d(
                ${x}px,
                ${y}px,
                ${depth}px
            )

            translate(-50%, -50%)

            rotateY(${rotateY}deg)

            rotateX(${rotateX}deg)

            scale(${scale})
            `;


        /*
           Sedikit perubahan opacity
           berdasarkan kedalaman.
        */

        const opacity =
            .48 +
            (
                (depth + 20) /
                40
            ) * .45;


        item.element.style.opacity =
            Math.max(
                .3,
                Math.min(
                    1,
                    opacity
                )
            );

    });


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
